# Salin file ini menjadi .streamlit/secrets.toml lalu isi nilainya.
# secrets.toml sudah tercantum di .gitignore dan TIDAK boleh di-commit.
# Untuk Streamlit Community Cloud, isi nilai yang sama di menu App settings → Secrets.

[supabase]
# Project URL: Supabase Dashboard → Project Settings → Data API.
# Cukup sampai .supabase.co — tanpa /rest/v1/ di belakangnya.
url = "https://xxxxxxxxxxxxxxxxxxxx.supabase.co"
# Publishable key (format baru), BUKAN anon key lama dan BUKAN secret key
key = "sb_publishable_xxxxxxxxxxxxxxxxxxxxxxxx"

# --- Khusus fitur Admin (opsional; tanpa ini Dashboard tetap memakai dataset penelitian) ---
# Secret key: Project Settings → API Keys → Secret keys (format sb_secret_...).
# Project lama boleh memakai service_role key. Key ini MELEWATI semua aturan keamanan (RLS):
# hanya dipakai di server aplikasi, JANGAN dibagikan, JANGAN di-commit, JANGAN dipakai di browser.
service_key = "sb_secret_xxxxxxxxxxxxxxxxxxxxxxxx"
# Nama bucket Storage PRIVAT untuk versi data Dashboard (Storage → New bucket, Public = OFF).
bucket = "data-dashboard"
